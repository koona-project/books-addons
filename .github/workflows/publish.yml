name: Publish Add-ons

on:
  push:
    branches:
      - main
    paths:
      - "examples/**"
      - "registry/**"
      - "withdrawn.json"
  workflow_dispatch:
    inputs:
      force:
        description: "Force re-signing and uploading index.json & catalog.json even if unchanged"
        required: false
        default: false
        type: boolean
      live_url:
        description: "Override live index URL (source of truth for serial and hashes)"
        required: false
        default: ""
        type: string
      verify_url:
        description: "Override HTTPS verification URL (e.g. R2 public URL before DNS cutover)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: publish-addons
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: publish
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Run pipeline tests
        run: bun test

      - name: Build, sign, and publish to R2
        env:
          ADDONS_SIGNING_KEY: ${{ secrets.ADDONS_SIGNING_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          FORCE_PUBLISH: ${{ inputs.force }}
          LIVE_URL: ${{ inputs.live_url }}
          VERIFY_URL: ${{ inputs.verify_url }}
        run: |
          args=()
          if [ "${FORCE_PUBLISH}" = "true" ]; then
            args+=(--force)
          fi
          if [ -n "${LIVE_URL}" ]; then
            args+=(--live-url "${LIVE_URL}")
          fi
          if [ -n "${VERIFY_URL}" ]; then
            args+=(--verify-url "${VERIFY_URL}")
          fi
          bun scripts/publish.ts "${args[@]}"
